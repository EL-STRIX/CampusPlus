name: Admin App CI

on:
  push:
    branches: [main, staging]
    paths: ['admin-app/**']

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd admin-app && npm ci
      - run: cd admin-app && npm run lint
      - run: cd admin-app && npm run build
